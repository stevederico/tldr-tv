<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch</title>
    <link rel="stylesheet" href="pip.css" />
  </head>
  <body>
    <div class="player" id="root" data-paused="true">
      <div class="hero" id="hero">
        <div class="hero-blur" id="blur" aria-hidden="true"></div>
        <img id="cover" class="hero-img" alt="Current illustration" hidden />

        <div class="build" id="build" aria-live="polite">
          <p class="build-title" id="buildTitle">Preparing your guide…</p>
          <p class="build-step" id="buildStep">Starting…</p>
          <div class="build-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="buildBarWrap">
            <div class="build-bar-fill" id="buildBar"></div>
          </div>
          <p class="build-pct" id="buildPct">0%</p>
        </div>

        <div class="overlay" data-overlay>
          <div class="timeline" id="timeline">
            <div class="timeline-track">
              <div class="timeline-fill" id="fill"></div>
              <div class="timeline-thumb" id="thumb"></div>
            </div>
          </div>
          <div class="controls">
            <button type="button" id="play" class="icon-btn" aria-label="Play" title="Play/Pause" disabled>
              <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
            </button>
            <div class="time" id="time">0:00 / 0:00</div>
            <button type="button" id="open" class="text-btn" title="Open full player">Full</button>
          </div>
        </div>
      </div>
      <audio id="audio" preload="auto"></audio>
    </div>
    <script type="module" src="pip.js"></script>
  </body>
</html>
